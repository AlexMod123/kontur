[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kontur-pro"
dynamic = ["version"]
description = "КОНТУР-ПРО — проектирование инженерных систем зданий (ПУЭ, СП, ГОСТ)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
pdf = ["reportlab>=4.0"]
dxf = ["ezdxf>=1.1"]
gui = ["PyQt6>=6.5"]
all = ["kontur-pro[excel,pdf,dxf,gui]"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pyinstaller>=6.0"]

[project.scripts]
kontur = "kontur.cli:main"

[tool.hatch.version]
path = "kontur/config/version.py"
pattern = 'VERSION(?:: Final)? = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["kontur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках/комментариях

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ezdxf", "ezdxf.*", "numpy", "numpy.*"]
follow_imports = "skip"
